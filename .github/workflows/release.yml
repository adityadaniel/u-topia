name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

jobs:
  bundle:
    name: Utopia.app
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Point at the installed Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-15

      # `make zip` runs `make app` (xtask bundle + ad-hoc codesign) and dittos it up.
      - name: Build the bundle
        run: make zip
        env:
          CARGO_INCREMENTAL: 0

      - name: Find the zip
        id: zip
        run: echo "path=$(ls target/Utopia-*.zip | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Utopia-macos
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      # The bundle is ad-hoc signed, not notarized: Gatekeeper will refuse it on another
      # Mac until someone signs it with a Developer ID. Said out loud on the release.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Ad-hoc signed, not notarized: macOS will refuse it on another machine until it is signed with a Developer ID." \
            --verify-tag || true
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.zip.outputs.path }}" --clobber
