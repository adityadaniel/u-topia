[package]
name = "trellis-ffi"
description = "Trellis mobile core (PRD §14): the store behind a UniFFI surface for Swift/Kotlin shells"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "trellis_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
chrono.workspace = true
thiserror.workspace = true
trellis-core.workspace = true
trellis-store.workspace = true
trellis-sync.workspace = true
uniffi = { version = "0.32.2", features = ["cli"] }

[dev-dependencies]
tempfile.workspace = true
trellis-syncd = { path = "../trellis-syncd" }
tokio.workspace = true
